<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Nilai Informatika SMA Gunung Madu</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Tema Ivory White & Pastel Neon */
            --bg-color: #FFFFF0; /* Ivory White */
            --text-color: #2c3e50; /* Dark gray agar kontras di latar terang */
            --neon-pink: #ff9ce6; /* Pastel Neon Pink */
            --neon-blue: #8be9fd; /* Pastel Neon Cyan/Blue */
            --neon-green: #a7f3d0; /* Pastel Neon Green */
            --neon-yellow: #fef08a; /* Pastel Neon Yellow */
            --panel-bg: rgba(255, 255, 255, 0.9);
        }

        body {
            background-color: var(--bg-color);
            /* Pola Grid Halus Pastel */
            background-image: 
                linear-gradient(rgba(139, 233, 253, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 156, 230, 0.15) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--text-color);
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        .container {
            background: var(--panel-bg);
            border-top: 4px solid var(--neon-pink);
            border-bottom: 4px solid var(--neon-blue);
            padding: 40px;
            width: 100%;
            max-width: 450px;
            position: relative;
            z-index: 10;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(139, 233, 253, 0.3), 0 0 20px rgba(255, 156, 230, 0.2);
            transition: all 0.4s ease;
        }

        h1 {
            color: var(--text-color);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 30px;
            text-align: center;
            font-size: 2.2rem;
            text-shadow: 2px 2px 0px rgba(139, 233, 253, 0.5), -1px -1px 0px rgba(255, 156, 230, 0.5);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 25px;
        }

        input {
            background-color: #f8fafc;
            border: 2px solid #e2e8f0;
            border-left: 5px solid var(--neon-blue);
            color: var(--text-color);
            padding: 15px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1rem;
            outline: none;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--neon-pink);
            border-left-color: var(--neon-pink);
            background-color: #fff;
            box-shadow: 0 0 15px rgba(255, 156, 230, 0.4);
        }

        button {
            background-color: var(--neon-blue);
            color: #1e293b;
            border: none;
            padding: 18px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 6px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(139, 233, 253, 0.5);
        }

        button:hover {
            background-color: var(--neon-pink);
            color: white;
            box-shadow: 0 6px 20px rgba(255, 156, 230, 0.6);
            transform: translateY(-2px);
        }

        .result-panel {
            margin-top: 20px;
            padding: 25px;
            background-color: #ffffff;
            border: 2px dashed var(--neon-blue);
            border-radius: 8px;
            display: none;
            text-align: center;
        }

        .result-label {
            color: #64748b;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .result-value {
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--text-color);
            line-height: 1;
            margin-bottom: 15px;
        }

        #gifHasil {
            display: none;
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 0 auto;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .loading-blink {
            animation: blinker 0.8s linear infinite;
            color: var(--neon-pink);
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.5rem;
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }

    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <h1>NILAI FE SMT 2 25/26</h1>
        
        <div class="input-group">
            <input type="text" id="inputNama" placeholder="NAMA (nama depan / nama lengkap)">
            <input type="text" id="inputKelas" placeholder="KELAS (contoh: XA / XIA)">
            <button onclick="mulaiDekripsi()">CARI NILAI</button>
        </div>

        <div class="result-panel" id="resultPanel">
            <div class="result-label" id="labelNama">STATUS</div>
            <div class="result-value" id="teksNilai">-</div>
            <img id="gifHasil" src="" alt="Reaksi Nilai">
        </div>
    </div>

    <script>
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTnLOyAa38SVZJmIRCPwg4FvLbOojWuHbIHpcV_QjfIwMrwvluh8BTyZWzNGesXtkXHh9AHejYF7_fm/pub?gid=0&single=true&output=csv'; 

        function mulaiDekripsi() {
            const inputNama = document.getElementById('inputNama').value.toLowerCase().trim();
            const inputKelas = document.getElementById('inputKelas').value.toLowerCase().trim();
            const panel = document.getElementById('resultPanel');
            const teksNilai = document.getElementById('teksNilai');
            const labelNama = document.getElementById('labelNama');
            const gifContainer = document.getElementById('gifHasil');

            panel.style.display = 'block';
            gifContainer.style.display = 'none'; // Sembunyikan GIF saat loading

            if (!inputNama || !inputKelas) {
                teksNilai.innerHTML = '<span style="font-size: 1.2rem; color: var(--neon-pink);">DATA TIDAK LENGKAP</span>';
                labelNama.innerText = "ERROR";
                return;
            }

            labelNama.innerText = "MEMPROSES DATA...";
            teksNilai.innerHTML = '<span class="loading-blink">...</span>';

            setTimeout(() => {
                tarikDataSpreadsheet(inputNama, inputKelas, labelNama, teksNilai, gifContainer);
            }, 1000); // Waktu loading dikurangi agar lebih cepat dan nyaman
        }

        async function tarikDataSpreadsheet(inputNama, inputKelas, labelNama, teksNilai, gifContainer) {
            try {
                const response = await fetch(sheetUrl);
                const data = await response.text();
                
                const baris = data.split('\n');
                let ditemukan = false;

                for (let i = 1; i < baris.length; i++) {
                    const kolom = baris[i].split(','); 
                    
                    if (kolom.length >= 3) {
                        const namaSheet = kolom[0].toLowerCase().trim();
                        const kelasSheet = kolom[1].toLowerCase().trim();
                        const nilaiSheet = parseFloat(kolom[2].trim());

                        if (namaSheet.includes(inputNama) && kelasSheet.includes(inputKelas)) {
                            labelNama.innerText = `NILAI // ${kolom[0].toUpperCase()}`;
                            teksNilai.innerText = nilaiSheet;
                            
                            // Logika Pemanggilan GIF
                            gifContainer.style.display = 'block';
                            
                            if (nilaiSheet < 50) {
                                gifContainer.src = 'a.gif';
                            } else if (nilaiSheet >= 75 && nilaiSheet <= 80) {
                                gifContainer.src = 'b.gif';
                            } else if (nilaiSheet >= 81 && nilaiSheet <= 100) {
                                gifContainer.src = 'c.gif';
                            } else {
                                // Area kosong untuk rentang 50 - 74 karena informasi belum diberikan
                                gifContainer.style.display = 'none';
                                gifContainer.src = '';
                            }
                            
                            ditemukan = true;
                            break; 
                        }
                    }
                }

                if (!ditemukan) {
                    labelNama.innerText = "TIDAK DITEMUKAN";
                    teksNilai.innerHTML = '<span style="font-size: 1.5rem; color: #ff9ce6;">KOSONG</span>';
                }

            } catch (error) {
                labelNama.innerText = "JARINGAN GAGAL";
                teksNilai.innerHTML = '<span style="font-size: 1.5rem; color: #ff9ce6;">OFFLINE</span>';
                console.error("Error fetching data: ", error);
            }
        }
    </script>
</body>
</html>
